<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>TEE 经食管超声切面模拟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e0e10;color:#ddd;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;user-select:none}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#1a1a1c;gap:6px}
h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end}
.tabs button,.tg{background:#2a2a2e;color:#ccc;border:1px solid #444;border-radius:14px;padding:5px 10px;font-size:12px}
.tabs button.on,.tg.on{background:#2a8ae0;color:#fff;border-color:#2a8ae0}
#bar,#pathBar,#quizBar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 6px;background:#141416;font-size:12px;flex-wrap:wrap;gap:4px}
#pathBar>span:last-child,#quizBar>span:last-child,#bar>span:last-child{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-end}
#stage{display:flex;gap:4px;padding:4px;background:#0a0a0c}
#v3d,#vx{position:relative;flex:1;aspect-ratio:1/1;max-height:42vh;overflow:hidden;touch-action:pan-y;border-radius:4px}
#v3d{background:radial-gradient(ellipse at 40% 35%,#1a2838,#0c1018 70%)}
#vx{background:#050508}
#v3d canvas,#vx canvas{display:block;width:100%;height:100%}
.cap{position:absolute;left:6px;top:4px;font-size:11px;color:#ccc;pointer-events:none;text-shadow:0 0 3px #000;z-index:2}
#readout{position:absolute;right:6px;top:4px;font-size:13px;font-weight:700;color:#7ec8ff;text-shadow:0 0 4px #000;pointer-events:none;text-align:right;line-height:1.25;z-index:2}
#vxBadge{position:absolute;left:6px;bottom:6px;font-size:11px;color:#9fd0ff;text-shadow:0 0 3px #000;z-index:2;pointer-events:none}
.fsb{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:8px;border:1px solid #555;background:rgba(0,0,0,.5);color:#fff;font-size:17px;z-index:4;touch-action:manipulation}
.fsb.zr{right:46px;font-size:12px}
#v3d.full,#vx.full{position:fixed;inset:0;max-height:none;aspect-ratio:auto;z-index:50;border-radius:0}
.ctrl{padding:6px 8px;font-size:11px}
.ctrl .r{display:flex;align-items:center;gap:4px;margin:4px 0}
.ctrl input[type=range]{flex:1;min-width:0}
.ctrl .lab{min-width:52px;color:#9aa4b2}
.ctrl .val{min-width:44px;text-align:right;color:#7ec8ff}
#tip{padding:6px 10px;font-size:12px;color:#9fd0ff;min-height:36px;background:#12161e;line-height:1.45}
#presets{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px 8px}
#presets button{background:#222226;color:#eee;border:1px solid #3a3a40;border-radius:7px;padding:6px 3px;font-size:11px;line-height:1.25;text-align:center}
#presets button small{display:block;color:#888;font-size:9px;margin-top:2px}
#presets button.on{border-color:#2a8ae0;background:#102838}
#segMap{display:flex;gap:4px;padding:4px 8px 2px;flex-wrap:wrap;align-items:center;font-size:11px}
#segMap .s{padding:3px 7px;border-radius:5px;border:1px solid #444;background:#1a1a1e;color:#aaa}
#segMap .s.on{background:#c45a2a;color:#fff;border-color:#e08a2a;font-weight:600}
#segMap .lbl{color:#777;margin-right:4px}
footer{text-align:center;color:#666;font-size:11px;padding:8px 0 18px}
#toTop{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;background:rgba(42,42,46,.92);color:#ddd;border:1px solid #555;border-radius:16px;padding:6px 12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;touch-action:manipulation}
#toTop.show{opacity:1;pointer-events:auto}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior:none}
#v3d.zm,#vx.zm,#v3d.full,#vx.full{touch-action:none}
button,.tg,#presets button{touch-action:manipulation}
input[type=range]{touch-action:pan-y}
@media (min-width:720px){
 #stage{gap:6px;padding:6px}
 #v3d,#vx{max-height:52vh}
 #presets{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:520px){
 #stage{flex-direction:column}
 #v3d,#vx{max-height:36vh;aspect-ratio:4/3}
 #presets{grid-template-columns:repeat(3,1fr)}
 h1{font-size:13px}
}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
 body{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,36vw,460px);grid-template-rows:auto auto 1fr;grid-template-areas:"st hd" "st a" "st b";height:100vh;height:100dvh;overflow:hidden}
 header{grid-area:hd}#sideA{grid-area:a}#sideB{grid-area:b;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
 #stage{grid-area:st;flex-direction:row;align-items:center;min-height:0}
 #v3d,#vx{max-height:none;height:100%;aspect-ratio:auto}
 #presets{grid-template-columns:repeat(3,1fr)}
 #toTop{display:none}
}
#quizPanel{display:none;padding:8px 10px;background:#1a1220;border-top:1px solid #3a2a4a;font-size:12px;line-height:1.45}
#quizPanel.on{display:block}
#quizPanel b{color:#e0a0ff}
#quizBtns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
#quizBtns button{background:#2a2230;color:#eee;border:1px solid #554;border-radius:7px;padding:6px 10px;font-size:12px}
#quizBtns button.ok{border-color:#3a8;background:#1a3a2a}
#quizBtns button.bad{border-color:#a44;background:#3a1a1a}
</style></head><body>
<header>
 <h1>TEE 切面模拟</h1>
 <div class="tabs">
  <button data-mode="learn" class="on">学习</button>
  <button data-mode="quiz">测验</button>
 </div>
</header>
<div id="sideA">
<div id="bar"><span>显示：</span><span>
 <button class="tg on" id="tgL">标注</button>
 <button class="tg on" id="tgH">半透心</button>
 <button class="tg on" id="tgP">探头</button>
 <button class="tg on" id="tgM">二尖瓣图</button>
 <button class="tg" id="tgPl">切面</button>
</span></div>
<div id="pathBar"><span>病理示意：</span><span id="paths">
 <button class="tg on" data-p="none">无</button>
 <button class="tg" data-p="mr">MR 反流</button>
 <button class="tg" data-p="as">AS</button>
 <button class="tg" data-p="wma">室壁运动</button>
 <button class="tg" data-p="pe">心包积液</button>
</span></div>
</div>
<div id="stage">
 <div id="v3d"><div class="cap">3D · 探头与解剖</div><div id="readout"></div></div>
 <div id="vx"><div class="cap">超声切面</div><div id="vxBadge"></div></div>
</div>
<div id="sideB">
<div class="ctrl">
 <div class="r"><span class="lab">深度</span><input id="depth" type="range" min="0" max="100" value="45"><span class="val" id="depthV">中段食管</span></div>
 <div class="r"><span class="lab">前/后屈</span><input id="flex" type="range" min="-60" max="60" value="0"><span class="val" id="flexV">0°</span></div>
 <div class="r"><span class="lab">左右转</span><input id="turn" type="range" min="-90" max="90" value="0"><span class="val" id="turnV">0°</span></div>
 <div class="r"><span class="lab">多平面</span><input id="omni" type="range" min="0" max="180" value="0"><span class="val" id="omniV">0°</span></div>
 <div style="margin-top:4px;color:#777">单指拖动旋转 3D · 双指缩放 · 点预设切面 · 调多平面角</div>
</div>
<div id="segMap"><span class="lbl">二尖瓣：</span>
 <span class="s" data-seg="A1">A1</span><span class="s" data-seg="A2">A2</span><span class="s" data-seg="A3">A3</span>
 <span class="s" data-seg="P1">P1</span><span class="s" data-seg="P2">P2</span><span class="s" data-seg="P3">P3</span>
</div>
<div id="tip">选择 ASE/SCA 标准 TEE 切面，或手动调节探头深度 / 屈伸 / 扭转 / 多平面角度。</div>
<div id="quizPanel"><div id="quizQ"></div><div id="quizBtns"></div></div>
<div id="presets"></div>
<footer>仅供教学参考 · 简化示意模型 · ASE/SCA TEE 标准切面 · v1.0.1</footer>
</div>
<button id="toTop">顶部</button>
<script src="vendor/three.min.js"></script>
<script src="app.js"></script>
</body></html>
